<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Autenticação Canva - SublimStudio PRO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0e15;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(0, 196, 204, 0.2);
      border-top-color: #00c4cc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Conectando com o Canva...</h2>
  <p id="status">Processando autorização segura OAuth 2.0</p>

  <script>
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const authCode = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      if (error) {
        document.getElementById('status').innerText = 'Erro na autorização: ' + error;
        setTimeout(() => window.close(), 3000);
      } else if (authCode) {
        document.getElementById('status').innerText = 'Autorizado com sucesso! Sincronizando...';
        if (window.opener) {
          window.opener.postMessage({
            tipo: 'CANVA_AUTH_SUCCESS',
            code: authCode,
            state: state
          }, '*');
        }
        setTimeout(() => window.close(), 600);
      } else {
        // Fallback for simulation / mock callback
        if (window.opener) {
          window.opener.postMessage({
            tipo: 'CANVA_AUTH_SUCCESS',
            code: 'demo_canva_auth_token_' + Date.now(),
            state: state
          }, '*');
        }
        setTimeout(() => window.close(), 800);
      }
    } catch (e) {
      console.error(e);
      setTimeout(() => window.close(), 1500);
    }
  </script>
</body>
</html>
